// Resurgence test server — iw6-mod dedicated.
// Nothing auto-execs this file; it is named on the command line:
//   ./iw6x.exe -dedicated +set net_port 28960 +exec server.cfg +map_rotate
// deploy.sh copies it to <install>/main/ -- `exec` does not search the
// install root, and a copy there is silently ignored.

set sv_hostname "Resurgence Test"
set sv_maxclients 18

// Resurgence rides the free-for-all gametype (ADR-1).
set g_gametype dm

// ADR-2 depends on numlives staying 0: our own watcher detects squad wipes,
// so vanilla's lives bookkeeping and latecomer rules stay out of the way.
set scr_friendlyfire 0
set scr_dm_numlives 0
set scr_dm_playerrespawndelay 0

// Both limits off: early verification cycles should not be racing the clock
// or a score limit while we watch redeploy and squad behaviour.
set scr_dm_scorelimit 0
set scr_dm_timelimit 0

set scr_resurgence_enabled 1
set scr_resurgence_debug 1

// Five phases of 35s hold + 20s shrink is a ~4.5 minute closing sequence.
set scr_resurgence_zone_radius_start 2600
set scr_resurgence_zone_radius_end 250
set scr_resurgence_zone_phases 5
set scr_resurgence_zone_hold 35
set scr_resurgence_zone_shrink 20
set scr_resurgence_zone_damage 5
set scr_resurgence_squadsize 2

// Ring on. Defaults are tuned to mp_prisonbreak, measured rather than
// guessed: the spawn centroid is about (-196, -399, 986) and players were
// found up to ~2234 units out, so the spec's original 4000 start radius
// would have done nothing for the first two phases.
set scr_resurgence_zone_enabled 1

// Bots: autojoin OFF by default -- with it on, the server fills every slot
// (18 here), far too many to watch duo behaviour in. There is no way to add
// bots at runtime: addbot / addtestclient / clientkick are all console-only
// and do nothing over rcon. To test with a controlled number, launch with
//   +set sv_maxclients 4 +set sv_botsAutoJoin 1
set sv_botsAutoJoin 0

// rcon lets the verification loop drive the console from WSL (tools/rcon.py).
// The password is deliberately NOT set here -- this repo is public. Pass it at
// launch instead:  +set rcon_password <your-value>
// and export the same value as RCON_PASSWORD for tools/rcon.py.

set sv_mapRotation "gametype dm map mp_prisonbreak"
