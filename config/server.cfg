// Resurgence — session config.
//
// Nothing auto-execs this; run-server.sh passes it with +exec server.cfg.
// deploy.sh copies it to <install>/main/ -- `exec` does not search the
// install root, and a copy there is silently ignored.
//
// Dvars our GSC registers do not exist until the scripts load, so every line
// needs `set`: a bare "name value" line is only a command for an
// already-registered dvar and fails silently otherwise.

set sv_hostname "Resurgence"
set sv_maxclients 18

// ---- gametype ----
// Resurgence rides free-for-all (ADR-1). numlives stays 0: our own watcher
// detects squad wipes, so vanilla's lives bookkeeping stays out of the way.
set g_gametype dm
set scr_friendlyfire 0
set scr_dm_numlives 0
set scr_dm_playerrespawndelay 0

// No score or time limit: the ring and last-squad-standing end matches.
set scr_dm_scorelimit 0
set scr_dm_timelimit 0

// ---- squads ----
// 1 = solo battle royale, which is what bots are actually good for: they have
// no squad awareness, so as squadmates they just duel their own partner.
// Set 2 for duos when playing with people.
set scr_resurgence_enabled 1
set scr_resurgence_squadsize 1
set scr_resurgence_redeploydelay 15
set scr_resurgence_spawn_min_dist 200

// ---- loadout ----
// Names harvested from kill logs, not guessed.
set scr_resurgence_primary "iw6_imbel_mp"
set scr_resurgence_secondary "iw6_p226_mp"

// ---- the ring ----
// Measured on mp_prisonbreak: spawn centroid about (-196, -399, 986), players
// found up to ~2234 units out. A 2200 start therefore covers the playable area
// without wasting phases on empty space. 5 x (35 + 20) is a ~4.5 minute close.
set scr_resurgence_zone_enabled 1
set scr_resurgence_zone_radius_start 2200
set scr_resurgence_zone_radius_end 250
set scr_resurgence_zone_phases 5
set scr_resurgence_zone_hold 35
set scr_resurgence_zone_shrink 20
set scr_resurgence_zone_damage 5

// Hold the gas off at match start so nobody is being damaged while still
// parachuting down. Players are also immune to it entirely while descending.
set scr_resurgence_zone_start_delay 45

// Minimap markers do not render on this build -- see _zone.gsc. The on-screen
// readout (RING EDGE / MOVE IN + bearing) is what players actually get.
set scr_resurgence_zone_markers 0

// ---- time to kill ----
// Stock damage. Lower = weaker shots but LONGER time to kill; higher = the
// reverse. The two cannot move independently from here: fire rate is weapon
// data in a fastfile, so damage per shot is the only lever on TTK.
// Only player-dealt damage is scaled -- the ring keeps its own value.
// Melee is forced to take this many hits instead of being a one-shot.
// Both are live -- change them over rcon mid-session, no restart.
set scr_resurgence_damage_scale 1.0
set scr_resurgence_knife_hits 3

// ---- movement ----
// Base and sprint are multipliers on stock (g_speed 190). Sprint gets the
// extra on top of the base. Both re-read every second, so they can be tuned
// mid-session over rcon.
set scr_resurgence_speed_scale 1.02
set scr_resurgence_sprint_scale 1.05

// Perks: the class bypass puts everyone on class0, which has none, so sprint
// was stamina-limited. Space separated; each is applied in its own thread, so
// a name this build does not know costs nothing.
set scr_resurgence_perks "specialty_lightweight specialty_fastsprintrecovery specialty_unlimitedsprint specialty_marathon specialty_extremeconditioning"

// Real engine dvar on this iw6-mod build, off by default.
set bg_omnimovement 1

// ---- omnimovement (approximated, no animations exist for any of it) ----
// Strafe/backpedal boosted so there is no slow direction; dive on
// sprint+jump; and an omnidirectional slide, since vanilla's slide is a
// SPRINT-slide and therefore forward-only. The slide re-applies velocity
// every frame for its duration -- a single impulse is clamped away by the
// engine's crouch speed cap on the next frame.
set scr_resurgence_omni_enabled 1
set scr_resurgence_omni_scale 1.25
set scr_resurgence_dive_enabled 1
set scr_resurgence_dive_force 420
set scr_resurgence_dive_lift 150
set scr_resurgence_omnislide_enabled 1
set scr_resurgence_omnislide_force 650
set scr_resurgence_omnislide_time 0.55
set scr_resurgence_omnislide_scale 1.6

// ---- admin ----
// No GSC way to register a console command, so each action is a dvar the
// server watches and resets once it has acted. Reachable over rcon, including
// from a player's own in-game console.
//   scr_resurgence_admin_killbots 1   kill every bot
//   scr_resurgence_admin_killall  1   kill everyone, humans included
//   scr_resurgence_admin_restart  1   end the match now

// ---- logging ----
// Writes RSG: lines to logs/games_mp.log. Costs nothing and makes every
// session reviewable afterwards.
set scr_resurgence_debug 1

// ---- bots ----
// autojoin fills EVERY slot and bots cannot be added at runtime (addbot and
// friends are console-only and do nothing over rcon), so run-server.sh starts
// with a small sv_maxclients and raises it afterwards to open human slots.
set sv_botsAutoJoin 0

// Generous, so nobody is dropped while reading a scoreboard.
set scr_kick_time 900

// Rotation of the larger standard maps -- a battle royale wants space. The
// ring needs no per-map setup: it derives its centre and extent from each
// map's own spawn points at match start.
//
// Deliberately excluded: every mp_alien_* map (Extinction maps, which have no
// free-for-all spawn points) and mp_shipment_ns (tiny).
set sv_mapRotation "gametype dm map mp_hashima gametype dm map mp_lonestar gametype dm map mp_chasm gametype dm map mp_favela_iw6 gametype dm map mp_battery3 gametype dm map mp_flooded gametype dm map mp_skeleton gametype dm map mp_snow gametype dm map mp_boneyard_ns gametype dm map mp_prisonbreak"
